<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Resistance Labs broken-link mark</title>
  <desc id="desc">A transparent broken chain-link logo with a controlled digital rupture at the center.</desc>
  <defs>
    <filter id="core-glow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.88 0 0.42 0 0 0.22 0 0 0.08 0 0.02 0 0 0 0.62 0" result="warm"/>
      <feMerge>
        <feMergeNode in="warm"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="link-edge" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f3efe4" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g transform="translate(600 390) rotate(-24)" filter="url(#link-edge)">
    <path d="M-420 0
             a170 96 0 0 1 170 -96
             h238
             a170 96 0 0 1 0 192
             h-238
             a170 96 0 0 1 -170 -96"
          fill="none" stroke="#010101" stroke-width="104" stroke-linecap="round"/>
    <path d="M183 -96
             h238
             a170 96 0 0 1 0 192
             h-238
             a170 96 0 0 1 0 -192"
          fill="none" stroke="#010101" stroke-width="104" stroke-linecap="round"/>
    <path d="M-330 -39 h180" fill="none" stroke="#f3efe4" stroke-width="8" stroke-linecap="round" opacity="0.12"/>
    <path d="M280 -39 h180" fill="none" stroke="#f3efe4" stroke-width="8" stroke-linecap="round" opacity="0.12"/>
  </g>

  <g filter="url(#core-glow)">
    <path d="M500 402 L568 366 L542 432 L612 402 L586 475 L705 392"
          fill="none" stroke="#ff6b1a" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M452 429 H745" fill="none" stroke="#00d8ff" stroke-width="7" opacity="0.86"/>
    <path d="M493 457 H667" fill="none" stroke="#9d35ff" stroke-width="6" opacity="0.82"/>
    <path d="M564 342 H695" fill="none" stroke="#ff6b1a" stroke-width="6" opacity="0.7"/>

    <rect x="464" y="372" width="24" height="24" fill="#00d8ff"/>
    <rect x="505" y="456" width="34" height="34" fill="#ff6b1a"/>
    <rect x="552" y="390" width="18" height="18" fill="#b34cff"/>
    <rect x="613" y="438" width="26" height="26" fill="#25f0c8"/>
    <rect x="679" y="360" width="20" height="20" fill="#ff6b1a"/>
    <rect x="710" y="420" width="15" height="15" fill="#00d8ff"/>
    <rect x="432" y="449" width="16" height="16" fill="#ff42b3"/>
    <rect x="735" y="468" width="12" height="12" fill="#8b35ff"/>
    <rect x="529" y="333" width="13" height="13" fill="#ff6b1a"/>
    <rect x="646" y="500" width="18" height="18" fill="#00d8ff"/>
  </g>
</svg>
